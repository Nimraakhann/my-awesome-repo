r. Do not punish tomorrow.</p></div></section></div>`}function detail(z){let i=P.findIndex(x=>x.date==z);if(i<0)return home();let x=P[i],bs=x.blocks.map(b=>`<article class="blk ${b.title.startsWith('Jobs')?'jobs':''}"><div class=time>${e(b.time)}</div><div><h3>${e(b.title)}</h3><p>${e(b.text)}</p>${b.url?`<a class=src target=_blank rel=noopener href="${b.url}">Open source ↗</a>`:''}</div></article>`).join('');A.innerHTML=`<div class=w>${H()}<p><a class=back href="#">← Calendar</a></p><section class=hero><small style="color:#f7a9d0">${x.weekday} · ${x.date}</small><h1>${e(x.focus)}</h1><p>${x.kind==='mock'?'Checkpoint/mock day':x.kind==='buffer'?'Light final day':x.kind==='exam'?'Exam day':'Normal study day'}</p></section>${bs}${x.note?`<div class=note><b>Today:</b> ${e(x.note)}</div>`:''}<div class=nav>${i?`<a href="#${P[i-1].date}">← ${P[i-1].date}</a>`:'<span></span>'}${i<P.length-1?`<a href="#${P[i+1].date}">${P[i+1].date} →</a>`:''}</div></div>`;scrollTo(0,0)}function R(){let h=location.hash.slice(1);/^2026-\d\d-\d\d$/.test(h)?detail(h):home()}addEventListener('hashchange',R);R();</script></body></html>
